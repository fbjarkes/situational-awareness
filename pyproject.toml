[project]
name = "situational-awareness"
version = "0.1.0"
description = "Daily market situational awareness report"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
market-report = "situational_awareness.market_report:main"
custom-breadth = "situational_awareness.custom_breadth:main"
breadth-study = "situational_awareness.breadth_study:main"
earnings = "situational_awareness.earnings:main"
cot = "situational_awareness.cot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/situational_awareness"]
